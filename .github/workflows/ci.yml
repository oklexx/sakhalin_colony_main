name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

permissions:
  contents: read
  pull-requests: write

jobs:
  # ── Lint: полный свод ruff из pyproject.toml (E/W/F/I/B/UP) ───────────────
  # Правила и исключения — только в pyproject.toml, здесь без --select:
  # локальный `make lint` и CI обязаны давать один и тот же результат.
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ruff check
        run: |
          python -m pip install "ruff==0.16.9"
          ruff check --output-format=github .

  # ── Типы: mypy по rl/, train_ui2/, python/ и CLI-скриптам ─────────────────
  # Набор файлов и строгость — в [tool.mypy] pyproject.toml. torch/PySide6/
  # gymnasium/SB3 там заглушены (follow_imports = "skip"), поэтому job ставит
  # только numpy — а результат тот же, что и локально с полным окружением.
  mypy:
    name: mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: mypy
        run: |
          python -m pip install "mypy==2.3.1" "numpy==2.4.6"
          mypy

  # ── C++-ядро: проверки, которым не нужен Python ────────────────────────────
  # Один и тот же скрипт, что гоняют локально: ./scripts/cpp_checks.sh
  cpp-probes:
    name: C++ пробы (compile-all + проверки)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Компилятор
        run: g++ --version

      - name: Сборка и прогон проверок
        env:
          REWARD_STEPS: "4000"
        run: ./scripts/cpp_checks.sh

  # ── Python: расширение colony_cpp + весь pytest (включая Qt-тесты) ─────────
  python-tests:
    name: colony_cpp + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Системные библиотеки Qt (тесты с маркером ui)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Python-зависимости
        run: |
          python -m pip install --upgrade pip
          # torch берём CPU-сборкой: CUDA на раннере всё равно нет,
          # а CPU-колесо на порядок меньше.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt ninja

      - name: Сборка colony_cpp (CMake → python/colony_cpp*.so)
        run: |
          python -m cmake -B build -DCMAKE_BUILD_TYPE=Release
          python -m cmake --build build --parallel

      - name: Handshake с расширением
        run: python -c "import sys; sys.path.insert(0, 'python'); import colony_cpp; print(colony_cpp.extension_info())"

      - name: pytest
        id: pytest
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        # pipefail обязателен: без него код возврата даёт tee, а не pytest,
        # и упавшие тесты выглядят зелёными.
        run: |
          set -o pipefail
          python -m pytest -v -rf 2>&1 | tee pytest.log

      # Логи job'а лежат на отдельном CDN и из части окружений недоступны,
      # поэтому хвост прогона дублируется комментарием в PR.
      - name: Хвост pytest в PR (только при падении)
        if: steps.pytest.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### pytest — хвост прогона (job ${{ github.run_id }})"
            echo '```'
            tail -n 150 pytest.log
            echo '```'
          } > pytest_summary.md
          gh pr comment "$PR_NUMBER" --body-file pytest_summary.md

      - name: Провалить job, если pytest упал
        if: steps.pytest.outcome == 'failure'
        run: exit 1
