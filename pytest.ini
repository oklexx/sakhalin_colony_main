[pytest]
testpaths = tests

# ── Маркеры ──────────────────────────────────────────────────────────────────
# ui — тесты, которым нужны PySide6 и системные библиотеки Qt
#      (libegl1/libgl1/libxkbcommon0/libdbus-1-3). В окружении без графики они
#      честно скипаются; отключить целиком: `pytest -m "not ui"`.
# --strict-markers защищает от опечаток в именах маркеров.
markers =
    ui: требует Qt/PySide6 и системные библиотеки Qt (offscreen-прогон)
addopts = --strict-markers

# История: здесь стояло `addopts = --ignore=tests/test_ui2_smoke.py`.
# Причина исключения (не была задокументирована — п. 5 плана
# docs/REMAINING_WORK_2026_09.md): test_ui2_smoke.py был написан как скрипт —
# проверки выполнялись при ИМПОРТЕ модуля, а в конце стоял sys.exit(1). Под
# pytest это давало ошибку сбора (SystemExit на collection), а не упавший тест,
# и заодно писало состояние в настоящий ~/colony_runs/. Файл переведён в
# pytest-форму (тело в функции, HOME во временный каталог, skip вместо падения),
# поэтому игнор больше не нужен.
